name: pulsego

# `docker compose up` brings up the whole stack: postgres, a one-shot
# migration run, then the api and worker. The services never migrate
# themselves, so scaling the worker cannot race on the schema.
#
# `docker compose --profile observability up` additionally starts an
# OpenTelemetry Collector, Jaeger, Prometheus and Grafana:
#   Jaeger UI   http://localhost:16686
#   Prometheus  http://localhost:9092
#   Grafana     http://localhost:3000   (anonymous viewer access)
# Prometheus scrapes api and worker without any change to the app. Tracing
# stays off by default; to export traces to the collector, start with
#   OTEL_ENABLED=true OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 \
#     docker compose -f deployments/compose.yaml --profile observability up
# An unreachable collector never blocks startup or requests.

x-app-env: &app-env
  SERVICE_NAME: ${SERVICE_NAME:-pulsego}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://pulsego:pulsego@postgres:5432/pulsego?sslmode=disable
  API_KEY: ${API_KEY:-local-development-api-key}
  HTTP_ADDR: ":8080"
  INTERNAL_HTTP_ADDR: ":9090"
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
  WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
  WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
  WORKER_LEASE_DURATION: ${WORKER_LEASE_DURATION:-60s}
  DEFAULT_CHECK_INTERVAL: ${DEFAULT_CHECK_INTERVAL:-60s}
  DEFAULT_CHECK_TIMEOUT: ${DEFAULT_CHECK_TIMEOUT:-5s}
  ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
  CHECK_RETENTION_DAYS: ${CHECK_RETENTION_DAYS:-30}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}

x-build: &build
  context: ..
  dockerfile: deployments/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulsego
      POSTGRES_PASSWORD: pulsego
      POSTGRES_DB: pulsego
    ports:
      # Published on a non-default host port so the stack does not collide
      # with a PostgreSQL already running on 5432.
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsego -d pulsego"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs to completion and exits; api and worker wait for its success.
  migrate:
    build:
      <<: *build
      args:
        BINARY: migrate
    environment: *app-env
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    # The image's HEALTHCHECK probes :9090, which a one-shot job never serves.
    healthcheck:
      disable: true
    restart: "no"

  api:
    build:
      <<: *build
      args:
        BINARY: api
    environment: *app-env
    ports:
      - "${API_PORT:-8080}:8080"
      - "${API_INTERNAL_PORT:-9090}:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # A real GET, not --spider: the latter sends HEAD and would only prove
      # the port is open rather than that the handler responds.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "2", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      <<: *build
      args:
        BINARY: worker
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Same probe as the api: the worker serves /healthz on its internal
    # listener. Port 9090 is not published, Prometheus reaches it in-network.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "2", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # --- Profile: observability ----------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  # Jaeger v2 all-in-one with in-memory storage; receives OTLP gRPC on 4317
  # from the collector.
  jaeger:
    image: jaegertracing/jaeger:2.7.0
    profiles: ["observability"]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Host 9090 is the api internal port and 9091 is `make run-worker`.
      - "${PROMETHEUS_PORT:-9092}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:

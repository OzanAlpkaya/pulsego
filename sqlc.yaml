version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/repository/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_prepared_queries: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          # Map timestamps to time.Time (pointer when nullable) instead of
          # pgtype wrappers, so generated rows line up with domain types.
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true

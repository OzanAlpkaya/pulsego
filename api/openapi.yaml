openapi: 3.1.0

info:
  title: PulseGo API
  version: "1.0.0"
  description: |
    Uptime monitoring API. Register HTTP/HTTPS endpoints as monitors; background
    workers check them on a schedule and record availability and latency.

    All `/v1` endpoints require a bearer API key. The health endpoint is
    deliberately unauthenticated so that probes need no credential.

    Errors are returned as `application/problem+json` (RFC 7807). Every error
    carries a `request_id` that matches the server log record for the failure.
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: monitors
    description: Monitor definitions
  - name: checks
    description: Manual checks and check history
  - name: incidents
    description: Incident history
  - name: stats
    description: Uptime and latency summaries
  - name: health
    description: Liveness

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: |
        Reports that the process is running. Performs no database query, so an
        unreachable database does not make a healthy process look dead.
        Readiness, which does verify PostgreSQL, arrives in Sprint 5.
      security: []
      operationId: getHealthz
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /v1/monitors:
    post:
      tags: [monitors]
      summary: Create a monitor
      operationId: createMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMonitorRequest"
      responses:
        "201":
          description: The monitor was created.
          headers:
            Location:
              description: Path of the created monitor.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitor"
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    get:
      tags: [monitors]
      summary: List monitors
      description: |
        Returns one page of monitors, newest first. Soft-deleted monitors are
        never included.

        Pagination is keyset-based: pass the `next_cursor` from a response as
        the `cursor` of the following request. The cursor is opaque — do not
        construct or parse it. An absent `next_cursor` means the last page.
      operationId: listMonitors
      parameters:
        - name: limit
          in: query
          description: Page size.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's `next_cursor`.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: One page of monitors.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Monitor"
                  next_cursor:
                    type: string
                    description: Omitted on the last page.
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/monitors/{monitorID}:
    parameters:
      - name: monitorID
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [monitors]
      summary: Fetch a monitor
      operationId: getMonitor
      responses:
        "200":
          description: The monitor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitor"
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [monitors]
      summary: Update a monitor
      description: |
        Partial update. Omitted fields are left unchanged; there is no way to
        unset a field, because none of them are nullable. At least one field
        must be present.

        Shortening `interval_seconds` pulls the next check forward when the
        currently scheduled time would fall outside the new interval.
      operationId: updateMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMonitorRequest"
      responses:
        "200":
          description: The updated monitor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitor"
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      tags: [monitors]
      summary: Delete a monitor
      description: |
        Soft delete: the row is retained with a `deleted_at` timestamp so that
        historical check results stay meaningful, but the monitor is no longer
        scheduled and is absent from every read endpoint. Deleting an
        already-deleted monitor returns 404.
      operationId: deleteMonitor
      responses:
        "204":
          description: The monitor was deleted.
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/monitors/{monitorID}/checks:
    parameters:
      - name: monitorID
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [checks]
      summary: Request a manual check
      description: |
        Makes the monitor due now, so that the next worker poll checks it. The
        check runs asynchronously: the response confirms the request, and the
        result appears in the check history once a worker has run it.

        A disabled monitor is never checked, so requesting a check for one is
        a 409 rather than a request that silently does nothing.
      operationId: requestCheck
      responses:
        "202":
          description: The check was requested. The body is the monitor, with `next_check_at` moved to now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitor"
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MonitorDisabled"

    get:
      tags: [checks]
      summary: List a monitor's check history
      description: |
        Returns one page of check results, newest first. A monitor with no
        checks yet returns an empty `data`; a missing or deleted monitor is a
        404.

        Pagination works as for the monitor list, but cursors are not
        interchangeable: a monitor-list cursor sent here (or a check-history
        cursor sent to the monitor list) is a 400.
      operationId: listChecks
      parameters:
        - name: limit
          in: query
          description: Page size.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's `next_cursor`.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: One page of check results.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Check"
                  next_cursor:
                    type: string
                    description: Omitted on the last page.
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/monitors/{monitorID}/incidents:
    parameters:
      - name: monitorID
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [incidents]
      summary: List a monitor's incident history
      description: |
        Returns one page of incidents, newest first by `started_at` (ties are
        broken by `id`). An incident opens when the monitor goes from
        `degraded` to `down` and is resolved when it next goes `up`; at most
        one incident per monitor is open (`resolved_at` null) at a time. A
        monitor that has never been down returns an empty `data`; a missing or
        deleted monitor is a 404.

        Pagination works as for the check history, with its own cursor kind:
        a monitor-list or check-history cursor sent here, or an
        incident-history cursor sent to either of those, is a 400.
      operationId: listIncidents
      parameters:
        - name: limit
          in: query
          description: Page size.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's `next_cursor`.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: One page of incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/monitors/{monitorID}/stats:
    parameters:
      - name: monitorID
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [stats]
      summary: Get a monitor's uptime and latency over a window
      description: |
        Aggregates the monitor's checks over the window `(to - window, to]`:
        `to` is the database's current time, the start is exclusive and the
        end inclusive. `from` is always exactly `to` minus the window.

        - `uptime_percent` is `successful_checks / total_checks * 100`,
          rounded to 2 decimals. It is null when the window holds no checks.
        - Latency figures cover **successful checks only**: a failed check's
          latency is usually its timeout, not a response time.
          `avg_latency_ms` is rounded to 2 decimals; `p95_latency_ms` is
          computed with `percentile_disc`, so it is a latency that was
          actually observed, in whole milliseconds. Both are null when no
          check in the window succeeded.

        **Retention caveat:** checks older than `CHECK_RETENTION_DAYS` are
        deleted. If that is below 30, the `30d` window (and, below 7, the
        `7d` window) only covers the retained checks, although `from` still
        reports the full window.

        A missing or deleted monitor is a 404. Any `window` other than the
        three listed is a 400 validation problem naming the field `window`.
      operationId: getMonitorStats
      parameters:
        - name: window
          in: query
          description: The period to aggregate over, ending now.
          required: false
          schema:
            type: string
            enum: ["24h", "7d", "30d"]
            default: "24h"
      responses:
        "200":
          description: The monitor's stats over the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorStats"
        "400":
          description: |
            The monitor id is not a UUID (`urn:pulsego:problem:malformed-request`),
            or `window` is not one of `24h`, `7d`, `30d`
            (`urn:pulsego:problem:validation-error`, with an `errors` entry for
            `window`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The value of the API_KEY environment variable.

  responses:
    Unauthorized:
      description: The API key is missing or wrong.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such monitor.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Malformed:
      description: The request could not be parsed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: The body parsed but one or more fields are invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MonitorDisabled:
      description: |
        The monitor is disabled, so it cannot be checked. Enable it first. The
        problem type is `urn:pulsego:problem:monitor-disabled`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: RFC 7807 problem document.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Stable identifier for the kind of problem.
          examples: ["urn:pulsego:problem:validation-error"]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        request_id:
          type: string
          description: Matches the server log record for this failure.
        errors:
          type: array
          description: Present on validation failures; one entry per rejected field.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Monitor:
      type: object
      required:
        - id
        - name
        - url
        - interval_seconds
        - timeout_ms
        - expected_status_min
        - expected_status_max
        - failure_threshold
        - enabled
        - state
        - consecutive_failures
        - next_check_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        url:
          type: string
          format: uri
          maxLength: 2048
        interval_seconds:
          type: integer
          minimum: 10
          maximum: 86400
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
        expected_status_min:
          type: integer
          minimum: 100
          maximum: 599
        expected_status_max:
          type: integer
          minimum: 100
          maximum: 599
        failure_threshold:
          type: integer
          minimum: 1
          maximum: 10
        enabled:
          type: boolean
        state:
          type: string
          enum: [unknown, up, degraded, down]
          description: |
            `unknown` until the first check. `up` after any successful check.
            The first failure from `unknown` or `up` always gives `degraded`,
            because there is no direct `up` → `down` transition. A degraded
            monitor goes `down`, and opens an incident, once
            `consecutive_failures` reaches `failure_threshold`. Reaching
            `down` therefore takes `max(failure_threshold, 2)` consecutive
            failures: with `failure_threshold: 1`, the first failure gives
            `degraded` and the second gives `down`.
        consecutive_failures:
          type: integer
        last_checked_at:
          type: [string, "null"]
          format: date-time
        last_status_code:
          type: [integer, "null"]
        last_latency_ms:
          type: [integer, "null"]
        next_check_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Check:
      type: object
      description: |
        One stored check result. `success` is true exactly when `error_kind`
        is null; a successful check always has a `status_code`, and
        `error_message` is only set on failure. Response bodies are never
        stored.
      required:
        - id
        - success
        - status_code
        - latency_ms
        - error_kind
        - error_message
        - checked_at
      properties:
        id:
          type: integer
          format: int64
        success:
          type: boolean
        status_code:
          type: [integer, "null"]
          minimum: 100
          maximum: 599
          description: Null when no response arrived.
        latency_ms:
          type: integer
          minimum: 0
          description: |
            Time until response headers arrived or, on failure, until the
            failure.
        error_kind:
          type: [string, "null"]
          enum: [timeout, dns, connection, tls, redirect, unexpected_status, unknown, null]
        error_message:
          type: [string, "null"]
          maxLength: 512
        checked_at:
          type: string
          format: date-time

    Incident:
      type: object
      description: |
        A period during which the monitor was down. `started_at` and
        `resolved_at` are the `checked_at` of the opening and closing checks.
        The check references become null once retention deletes those checks;
        the incident itself is kept.
      required:
        - id
        - monitor_id
        - started_at
        - resolved_at
        - opening_check_id
        - closing_check_id
        - cause
        - created_at
      properties:
        id:
          type: string
          format: uuid
        monitor_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
          description: Null while the incident is open.
        opening_check_id:
          type: [integer, "null"]
          format: int64
          description: The check that opened the incident; null once retention has deleted it.
        closing_check_id:
          type: [integer, "null"]
          format: int64
          description: |
            The check that resolved the incident. Null while the incident is
            open, and once retention has deleted the check.
        cause:
          type: [string, "null"]
          maxLength: 512
          description: |
            `<error_kind>: <error_message>` of the opening check, or just
            `<error_kind>` when it had no message. Never a response body.
        created_at:
          type: string
          format: date-time

    IncidentPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        next_cursor:
          type: string
          description: Omitted on the last page.

    MonitorStats:
      type: object
      description: |
        Uptime and latency of one monitor over one window. Latency figures
        cover successful checks only. Checks older than
        `CHECK_RETENTION_DAYS` are not counted, even inside the window.
      required:
        - window
        - from
        - to
        - total_checks
        - successful_checks
        - uptime_percent
        - avg_latency_ms
        - p95_latency_ms
      properties:
        window:
          type: string
          enum: ["24h", "7d", "30d"]
        from:
          type: string
          format: date-time
          description: Exclusive start of the window; always `to` minus the window.
        to:
          type: string
          format: date-time
          description: Inclusive end of the window, the database's current time.
        total_checks:
          type: integer
          format: int64
          minimum: 0
        successful_checks:
          type: integer
          format: int64
          minimum: 0
        uptime_percent:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: |
            `successful_checks / total_checks * 100`, rounded to 2 decimals.
            Null when the window holds no checks.
          examples: [99.31]
        avg_latency_ms:
          type: [number, "null"]
          minimum: 0
          description: |
            Mean latency of the successful checks, rounded to 2 decimals.
            Null when no check in the window succeeded.
          examples: [182.45]
        p95_latency_ms:
          type: [integer, "null"]
          format: int32
          minimum: 0
          description: |
            95th percentile latency of the successful checks, computed with
            `percentile_disc`, so it is an observed value in whole
            milliseconds. Null when no check in the window succeeded.
          examples: [412]

    CreateMonitorRequest:
      type: object
      additionalProperties: false
      required: [name, url]
      description: |
        Omitted optional fields fall back to the deployment defaults
        (`DEFAULT_CHECK_INTERVAL`, `DEFAULT_CHECK_TIMEOUT`) or to the documented
        defaults below. Unknown fields are rejected rather than ignored.
      properties:
        name:
          type: string
          maxLength: 120
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Must use http or https, must not embed credentials, and must not
            include a fragment. Whether the target address is safe to contact is
            enforced separately at check time.
        interval_seconds:
          type: integer
          minimum: 10
          maximum: 86400
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
          description: Must be less than `interval_seconds`, so checks cannot overlap.
        expected_status_min:
          type: integer
          minimum: 100
          maximum: 599
          default: 200
        expected_status_max:
          type: integer
          minimum: 100
          maximum: 599
          default: 399
        failure_threshold:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        enabled:
          type: boolean
          default: true

    UpdateMonitorRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Every field is optional; at least one must be present.
      properties:
        name:
          type: string
          maxLength: 120
        url:
          type: string
          format: uri
          maxLength: 2048
        interval_seconds:
          type: integer
          minimum: 10
          maximum: 86400
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
        expected_status_min:
          type: integer
          minimum: 100
          maximum: 599
        expected_status_max:
          type: integer
          minimum: 100
          maximum: 599
        failure_threshold:
          type: integer
          minimum: 1
          maximum: 10
        enabled:
          type: boolean

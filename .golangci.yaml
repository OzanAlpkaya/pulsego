version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments

  exclusions:
    rules:
      # Tests may hard-code credentials for fixtures and skip error checks on
      # cleanup paths.
      - path: _test\.go$
        linters:
          - gosec
      # sqlc owns this code; style rules there are not actionable.
      - path: internal/repository/sqlcgen/
        linters:
          - revive
          - unconvert

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/OzanAlpkaya/pulsego
